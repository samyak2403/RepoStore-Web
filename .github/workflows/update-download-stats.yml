name: Update Download Stats

on:
  schedule:
    # Runs every hour, on the hour (UTC) for near real-time counts.
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  PACKAGE: com.samyak.repostore

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update IzzyOnDroid and F-Droid download counts
        run: python scripts/update_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/izzy-stats.json data/fdroid-stats.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update download stats [skip ci]"
            # Rebase on the latest remote state, then push to the current branch.
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
